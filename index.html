<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineGlesus - マインクラフト現実単位コンバーター</title>
  <link rel="manifest" href="manifest.json">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body {
      padding-top: env(titlebar-area-height, 0px);
    }
    #titlebar {
      position: fixed;
      top: 0;
      left: 0;
      width: env(titlebar-area-width, 100%);
      height: env(titlebar-area-height, 0px);
      app-region: drag;
      -webkit-app-region: drag;
      z-index: 50;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }
  </style>
</head>
<body class="h-full flex flex-col select-none antialiased transition-colors duration-200 bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100">

  <!-- WCO用ドラッグ可能タイトルバー領域 -->
  <div id="titlebar"></div>

  <!-- メインコンテンツ -->
  <div class="max-w-3xl w-full mx-auto p-4 md:p-6 flex-1 flex flex-col">
    
    <!-- ヘッダー & テーマ切り替え -->
    <header class="mb-4 flex justify-between items-center">
      <div>
        <h1 class="text-lg md:text-xl font-black tracking-wider text-emerald-500 dark:text-emerald-400">MineGlesus</h1>
        <p class="text-[11px] text-slate-500 dark:text-slate-400">マインクラフト現実単位換算ツール (1 Block = 1m)</p>
      </div>
      <div>
        <select id="theme-selector" class="bg-slate-200 dark:bg-slate-900 text-slate-800 dark:text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-800 focus:outline-none focus:border-emerald-500">
          <option value="system">システム追従</option>
          <option value="dark">ダーク</option>
          <option value="white">ホワイト</option>
        </select>
      </div>
    </header>

    <!-- タブ切り替えボタン -->
    <div class="flex bg-slate-200 dark:bg-slate-900 p-1 rounded-xl border border-slate-300 dark:border-slate-800 mb-6">
      <button class="tab-btn flex-1 py-2 text-xs md:text-sm font-bold rounded-lg transition bg-emerald-600 text-white shadow" data-target="tab-distance">座標・距離換算</button>
      <button class="tab-btn flex-1 py-2 text-xs md:text-sm font-bold rounded-lg transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" data-target="tab-volume">体積・容量換算</button>
      <button class="tab-btn flex-1 py-2 text-xs md:text-sm font-bold rounded-lg transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" data-target="tab-nether">ネザー座標連動</button>
    </div>

    <!-- コンテンツエリア -->
    <div class="space-y-6 flex-1">

      <!-- Tab 1: 座標・距離換算 -->
      <div id="tab-distance" class="tab-content space-y-4">
        <div class="flex gap-2 items-center overflow-x-auto pb-1">
          <span class="text-[10px] font-bold text-slate-400 shrink-0">プリセット:</span>
          <button class="preset-dist px-2.5 py-1 bg-slate-200 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-slate-700 dark:text-slate-300 text-[11px] font-medium rounded-md border border-slate-300 dark:border-slate-800 transition shrink-0" data-x1="0" data-y1="64" data-z1="0" data-x2="100" data-y2="64" data-z2="0">100m 直線</button>
          <button class="preset-dist px-2.5 py-1 bg-slate-200 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-slate-700 dark:text-slate-300 text-[11px] font-medium rounded-md border border-slate-300 dark:border-slate-800 transition shrink-0" data-x1="0" data-y1="64" data-z1="0" data-x2="1000" data-y2="64" data-z2="1000">1km 遠方</button>
          <button class="preset-dist px-2.5 py-1 bg-slate-200 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-slate-700 dark:text-slate-300 text-[11px] font-medium rounded-md border border-slate-300 dark:border-slate-800 transition shrink-0" data-x1="0" data-y1="-60" data-z1="0" data-x2="0" data-y2="320" data-z2="0">最深部〜最高高度</button>
        </div>

        <div class="bg-white dark:bg-slate-900/80 p-5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4 shadow-sm">
          <h2 class="text-xs font-bold uppercase tracking-widest text-emerald-600 dark:text-emerald-400">起点 (Start)</h2>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">X 座標</label>
              <input type="number" id="x1" value="0" class="coord-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">Y 座標</label>
              <input type="number" id="y1" value="64" class="coord-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">Z 座標</label>
              <input type="number" id="z1" value="0" class="coord-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-900/80 p-5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4 shadow-sm">
          <h2 class="text-xs font-bold uppercase tracking-widest text-emerald-600 dark:text-emerald-400">終点 (End)</h2>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">X 座標</label>
              <input type="number" id="x2" value="100" class="coord-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">Y 座標</label>
              <input type="number" id="y2" value="64" class="coord-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">Z 座標</label>
              <input type="number" id="z2" value="100" class="coord-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
          </div>
        </div>

        <!-- 結果表示 -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm">
          <div class="flex justify-between items-center text-sm border-b border-slate-200 dark:border-slate-800 pb-2">
            <span class="text-slate-500 dark:text-slate-400">直線距離 (Distance)</span>
            <span id="res-dist" class="font-mono text-emerald-600 dark:text-emerald-400 font-bold text-lg">0 m</span>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-50 dark:bg-slate-950 p-2 rounded-lg border border-slate-200 dark:border-slate-800/50">
              <div class="text-[10px] text-slate-400">キロメートル</div>
              <div id="res-km" class="font-mono text-sm font-semibold text-slate-800 dark:text-slate-200">0 km</div>
            </div>
            <div class="bg-slate-50 dark:bg-slate-950 p-2 rounded-lg border border-slate-200 dark:border-slate-800/50">
              <div class="text-[10px] text-slate-400">メートル</div>
              <div id="res-m" class="font-mono text-sm font-semibold text-slate-800 dark:text-slate-200">0 m</div>
            </div>
            <div class="bg-slate-50 dark:bg-slate-950 p-2 rounded-lg border border-slate-200 dark:border-slate-800/50">
              <div class="text-[10px] text-slate-400">センチメートル</div>
              <div id="res-cm" class="font-mono text-sm font-semibold text-slate-800 dark:text-slate-200">0 cm</div>
            </div>
          </div>
          <!-- エラー・警告メッセージ表示用 -->
          <div id="dist-error" class="text-xs text-rose-500 text-center hidden font-medium"></div>
        </div>
      </div>

      <!-- Tab 2: 体積・容量換算 -->
      <div id="tab-volume" class="tab-content hidden space-y-4">
        <div class="flex gap-2 items-center overflow-x-auto pb-1">
          <span class="text-[10px] font-bold text-slate-400 shrink-0">プリセット:</span>
          <button class="preset-vol px-2.5 py-1 bg-slate-200 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-slate-700 dark:text-slate-300 text-[11px] font-medium rounded-md border border-slate-300 dark:border-slate-800 transition shrink-0" data-w="1" data-h="1" data-d="1">1ブロック</button>
          <button class="preset-vol px-2.5 py-1 bg-slate-200 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-slate-700 dark:text-slate-300 text-[11px] font-medium rounded-md border border-slate-300 dark:border-slate-800 transition shrink-0" data-w="16" data-h="16" data-d="16">1チャンク</button>
          <button class="preset-vol px-2.5 py-1 bg-slate-200 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-slate-700 dark:text-slate-300 text-[11px] font-medium rounded-md border border-slate-300 dark:border-slate-800 transition shrink-0" data-w="50" data-h="10" data-d="50">大型プール</button>
        </div>

        <div class="bg-white dark:bg-slate-900/80 p-5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4 shadow-sm">
          <h2 class="text-xs font-bold uppercase tracking-widest text-emerald-600 dark:text-emerald-400">直方体サイズ設定 (ブロック数 = m)</h2>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">幅 (Width)</label>
              <input type="number" id="vol-w" value="10" min="0" class="vol-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">高さ (Height)</label>
              <input type="number" id="vol-h" value="10" min="0" class="vol-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">奥行 (Depth)</label>
              <input type="number" id="vol-d" value="10" min="0" class="vol-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
          </div>
        </div>

        <!-- 結果表示 -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm">
          <div class="flex justify-between items-center text-sm border-b border-slate-200 dark:border-slate-800 pb-2">
            <span class="text-slate-500 dark:text-slate-400">総体積 (Volume)</span>
            <span id="res-m3" class="font-mono text-emerald-600 dark:text-emerald-400 font-bold text-lg">0 m³</span>
          </div>
          <div class="grid grid-cols-2 gap-3 text-center">
            <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-lg border border-slate-200 dark:border-slate-800/50">
              <div class="text-[10px] text-slate-400">リットル (L)</div>
              <div id="res-l" class="font-mono text-base font-bold text-emerald-600 dark:text-emerald-400">0 L</div>
            </div>
            <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-lg border border-slate-200 dark:border-slate-800/50">
              <div class="text-[10px] text-slate-400">デシリットル (dL)</div>
              <div id="res-dl" class="font-mono text-base font-bold text-slate-800 dark:text-slate-200">0 dL</div>
            </div>
          </div>
          <div id="vol-error" class="text-xs text-rose-500 text-center hidden font-medium"></div>
        </div>
      </div>

      <!-- Tab 3: ネザー座標連動 -->
      <div id="tab-nether" class="tab-content hidden space-y-4">
        <div class="flex gap-2 items-center overflow-x-auto pb-1">
          <span class="text-[10px] font-bold text-slate-400 shrink-0">プリセット:</span>
          <button class="preset-nether px-2.5 py-1 bg-slate-200 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-slate-700 dark:text-slate-300 text-[11px] font-medium rounded-md border border-slate-300 dark:border-slate-800 transition shrink-0" data-x="800" data-z="800">拠点 (800, 800)</button>
          <button class="preset-nether px-2.5 py-1 bg-slate-200 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-slate-700 dark:text-slate-300 text-[11px] font-medium rounded-md border border-slate-300 dark:border-slate-800 transition shrink-0" data-x="1600" data-z="-1600">遠隔村 (1600, -1600)</button>
        </div>

        <div class="bg-white dark:bg-slate-900/80 p-5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-4 shadow-sm">
          <h2 class="text-xs font-bold uppercase tracking-widest text-emerald-600 dark:text-emerald-400">オーバーワールド座標</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">X 座標</label>
              <input type="number" id="ow-x" value="800" class="nether-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1">Z 座標</label>
              <input type="number" id="ow-z" value="800" class="nether-input w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-2 text-center font-mono text-base focus:outline-none focus:border-emerald-500">
            </div>
          </div>
        </div>

        <!-- 結果表示 -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm">
          <div class="text-xs font-bold text-slate-500 dark:text-slate-400">対応するネザー座標 (÷8)</div>
          <div class="grid grid-cols-2 gap-3 text-center">
            <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-lg border border-slate-200 dark:border-slate-800/50">
              <div class="text-[10px] text-slate-400">ネザー X</div>
              <div id="ne-x" class="font-mono text-base font-bold text-emerald-600 dark:text-emerald-400">100</div>
            </div>
            <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-lg border border-slate-200 dark:border-slate-800/50">
              <div class="text-[10px] text-slate-400">ネザー Z</div>
              <div id="ne-z" class="font-mono text-base font-bold text-emerald-600 dark:text-emerald-400">100</div>
            </div>
          </div>
          <div id="nether-error" class="text-xs text-rose-500 text-center hidden font-medium"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 堅牢なService Worker 登録（エラーハンドリング付き）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered! Scope:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }

    // テーマ切り替え制御
    function applyTheme(theme) {
      const htmlEl = document.documentElement;
      try {
        if (theme === 'dark') {
          htmlEl.classList.add('dark');
        } else if (theme === 'white') {
          htmlEl.classList.remove('dark');
        } else {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            htmlEl.classList.add('dark');
          } else {
            htmlEl.classList.remove('dark');
          }
        }
        localStorage.setItem('mineglesus_theme', theme);
      } catch (e) {
        console.warn('Theme storage failed:', e);
      }
    }

    const savedTheme = localStorage.getItem('mineglesus_theme') || 'system';
    $('#theme-selector').val(savedTheme);
    applyTheme(savedTheme);

    $('#theme-selector').on('change', function() {
      applyTheme($(this).val());
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ($('#theme-selector').val() === 'system') {
        applyTheme('system');
      }
    });

    // タブ切り替え
    $('.tab-btn').on('click', function() {
      $('.tab-btn').removeClass('bg-emerald-600 text-white shadow').addClass('text-slate-600 dark:text-slate-400');
      $(this).removeClass('text-slate-600 dark:text-slate-400').addClass('bg-emerald-600 text-white shadow');
      
      $('.tab-content').addClass('hidden');
      const target = $(this).data('target');
      $(`#${target}`).removeClass('hidden');
    });

    // 安全な数値パース関数（空欄やNaNならフォールバック値を返す）
    function safeParse(val, fallback = 0) {
      const parsed = parseFloat(val);
      return isNaN(parsed) ? fallback : parsed;
    }

    // 1. 距離計算（エラー処理強化）
    function updateDistance() {
      try {
        const x1 = safeParse($('#x1').val());
        const y1 = safeParse($('#y1').val());
        const z1 = safeParse($('#z1').val());
        const x2 = safeParse($('#x2').val());
        const y2 = safeParse($('#y2').val());
        const z2 = safeParse($('#z2').val());

        const dx = x2 - x1;
        const dy = y2 - y1;
        const dz = z2 - z1;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

        if (!isFinite(dist)) {
          throw new Error('計算値が有効な範囲を超えています');
        }

        const km = (dist / 1000).toFixed(3);
        const m = dist.toFixed(2);
        const cm = (dist * 100).toLocaleString(undefined, { maximumFractionDigits: 0 });

        $('#res-dist').text(`${m} m`);
        $('#res-km').text(`${km} km`);
        $('#res-m').text(`${m} m`);
        $('#res-cm').text(`${cm} cm`);
        $('#dist-error').addClass('hidden').text('');
      } catch (err) {
        $('#dist-error').removeClass('hidden').text('⚠️ 入力値にエラーがあります');
      }
    }

    // 2. 体積計算（エラー処理・負数対策強化）
    function updateVolume() {
      try {
        let w = safeParse($('#vol-w').val(), 0);
        let h = safeParse($('#vol-h').val(), 0);
        let d = safeParse($('#vol-d').val(), 0);

        // マイナスが入力された場合は絶対値に自動補正（あるいはエラー）
        w = Math.abs(w);
        h = Math.abs(h);
        d = Math.abs(d);

        const m3 = w * h * d;
        const liters = m3 * 1000;
        const deciliters = liters * 10;

        if (!isFinite(m3) || !isFinite(liters)) {
          throw new Error('数値が大きすぎます');
        }

        $('#res-m3').text(`${m3.toLocaleString()} m³`);
        $('#res-l').text(`${liters.toLocaleString()} L`);
        $('#res-dl').text(`${deciliters.toLocaleString()} dL`);
        $('#vol-error').addClass('hidden').text('');
      } catch (err) {
        $('#vol-error').removeClass('hidden').text('⚠️ 正の数値を入力してください');
      }
    }

    // 3. ネザー座標連動（エラー処理強化）
    function updateNether() {
      try {
        const owX = safeParse($('#ow-x').val());
        const owZ = safeParse($('#ow-z').val());

        const neX = (owX / 8).toFixed(1);
        const neZ = (owZ / 8).toFixed(1);

        if (!isFinite(owX) || !isFinite(owZ)) {
          throw new Error('無効な座標');
        }

        $('#ne-x').text(neX);
        $('#ne-z').text(neZ);
        $('#nether-error').addClass('hidden').text('');
      } catch (err) {
        $('#nether-error').removeClass('hidden').text('⚠️ 有効な座標を入力してください');
      }
    }

    // プリセットボタン
    $('.preset-dist').on('click', function() {
      $('#x1').val($(this).data('x1'));
      $('#y1').val($(this).data('y1'));
      $('#z1').val($(this).data('z1'));
      $('#x2').val($(this).data('x2'));
      $('#y2').val($(this).data('y2'));
      $('#z2').val($(this).data('z2'));
      updateDistance();
    });

    $('.preset-vol').on('click', function() {
      $('#vol-w').val($(this).data('w'));
      $('#vol-h').val($(this).data('h'));
      $('#vol-d').val($(this).data('d'));
      updateVolume();
    });

    $('.preset-nether').on('click', function() {
      $('#ow-x').val($(this).data('x'));
      $('#ow-z').val($(this).data('z'));
      updateNether();
    });

    // イベントバインド
    $('.coord-input').on('input', updateDistance);
    $('.vol-input').on('input', updateVolume);
    $('.nether-input').on('input', updateNether);

    // 初期化実行
    updateDistance();
    updateVolume();
    updateNether();
  </script>
</body>
</html>
